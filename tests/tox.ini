[tox]
skipsdist = true
envlist =
    pytest

[testenv]
passenv =
    http_proxy
    HTTP_PROXY
    https_proxy
    HTTPS_PROXY
    no_proxy
    NO_PROXY
    JAVA_HOME
usedevelop = true
basepython = python3
deps =
    -r{toxinidir}/requirements.txt

[testenv:pytest]
allowlist_externals =
    allure
commands =
    pytest --alluredir=allure-results -vv {posargs}
# Runs even when the tests fail, so failed runs still get a report. The
# leading "-" keeps a missing allure command from failing local runs.
commands_post =
    - allure generate allure-results


[pytest]
minversion = 8.4
addopts = -rAsv
log_cli = true
log_level = INFO
log_format = %(asctime)s [%(levelname)s] %(message)s
