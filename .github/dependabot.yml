# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(actions)"
    cooldown:
      default-days: 7
    groups:
      actions-deps:
        patterns:
          - "*"

  # Locked tools of the PyTest workflow (.github/workflows/pytest.yaml).
  - package-ecosystem: "pip"
    directory: "/tests/ci"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(pip)"
    cooldown:
      default-days: 7
    groups:
      pytest-tox-deps:
        patterns:
          - "*"

  - package-ecosystem: "npm"
    directory: "/tests/ci/allure"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(npm)"
    cooldown:
      default-days: 7
    groups:
      pytest-allure-deps:
        patterns:
          - "*"

  # Dependencies of the PyTest suite (tests/tox.ini).
  - package-ecosystem: "pip"
    directory: "/tests"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "CI(pip)"
    cooldown:
      default-days: 7
    groups:
      pytest-deps:
        patterns:
          - "*"
