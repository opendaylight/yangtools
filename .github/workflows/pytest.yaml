name: Gerrit Composed PyTest

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
    inputs:
      # Run as is, this tests the latest merged code. To test a pending
      # change, set GERRIT_REFSPEC to its refspec.
      GERRIT_BRANCH:
        description: "Branch that change is against"
        required: true
        default: "master"
        type: string
      GERRIT_PROJECT:
        description: "Project in Gerrit"
        required: true
        default: "yangtools"
        type: string
      GERRIT_REFSPEC:
        description: >-
          Gerrit refspec of change, e.g. refs/changes/78/127078/3.
          The default "master" tests the latest merged code.
        required: true
        default: "master"
        type: string
      TOX_ARGS:
        description: >-
          Arguments for tox, e.g. -- -k "etsi". Empty uses the
          tox.args default of the integration-tests profile in pom.xml.
        type: string

concurrency:
  # yamllint disable-line rule:line-length
  group: pytest-${{ github.workflow }}-${{ github.event.inputs.GERRIT_BRANCH }}-${{ github.event.inputs.GERRIT_REFSPEC }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # PRE_BUILD_SCRIPT below pastes TOX_ARGS into a heredoc, which a line of
  # its own could end, running the rest as shell. So reject multi-line
  # values here, reading the input only through env.
  check-inputs:
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Reject multi-line TOX_ARGS
        env:
          TOX_ARGS: ${{ inputs.TOX_ARGS }}
        run: |
          if [[ "${TOX_ARGS}" == *[$'\n\r']* ]]; then
            echo "::error::TOX_ARGS must be a single line"
            exit 1
          fi

  pytest:
    needs: check-inputs
    permissions:
      contents: read
      id-token: write
    # yamllint disable-line rule:line-length
    uses: lfit/releng-reusable-workflows/.github/workflows/compose-maven-verify.yaml@fc3aea6f1ec56737c3cdd8fe1c46cbbb7209394b # v0.11.1
    with:
      GERRIT_BRANCH: ${{ inputs.GERRIT_BRANCH }}
      # Required by compose-maven-verify; a manual run has no Gerrit change.
      GERRIT_CHANGE_ID: ${{ github.run_id }}
      GERRIT_PROJECT: ${{ inputs.GERRIT_PROJECT }}
      GERRIT_REFSPEC: ${{ inputs.GERRIT_REFSPEC }}
      JDK_VERSION: "21"
      MVN_VERSION: "3.9.6"
      MVN_PROFILES: "q,integration-tests"
      MVN_PHASES: "clean verify"
      # yamllint disable rule:line-length
      MVN_OPTS: >-
        -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn
        -Dmaven.repo.local=/tmp/r -Dorg.ops4j.pax.url.mvn.localRepository=/tmp/r
        -DaltDeploymentRepository=staging::default::file:"${GITHUB_WORKSPACE}"/m2repo
      # yamllint enable rule:line-length
      ENV_VARS: ${{ toJSON(vars) }}
      # Published to the log server, or as the build-logs artifact without
      # it. log-publish-action gzips text files such as .html in place for
      # either destination, keeping the original name without a .gz suffix:
      # the log server sends them with Content-Encoding: gzip, so browsers
      # unpack them, but in the artifact they stay gzipped.
      #
      # For now every run extends the Allure trend data (history.jsonl,
      # restored from the previous run below). Once this workflow runs on a
      # schedule, only the scheduled runs should extend it, so that the trend
      # follows one test selection on master; the verify job this is later
      # folded into will not use the history at all.
      ARCHIVE_ARTIFACTS: |
        tests/allure-report/allure-report.html
        tests/history/history.jsonl
      PRE_BUILD_SCRIPT: |
        #!/usr/bin/env bash
        set -euo pipefail

        # Hand TOX_ARGS to Maven through the environment (the tox-args-env
        # profile in pom.xml), where spaces and quotes survive;
        # maven-build-action splits MVN_PARAMS at whitespace. The
        # check-inputs job makes sure the value is a single line.
        tox_args=$(cat <<'TOX_ARGS_EOF'
        ${{ inputs.TOX_ARGS }}
        TOX_ARGS_EOF
        )
        if [ -n "${tox_args}" ]; then
          printf 'TOX_ARGS=%s\n' "${tox_args}" >> "$GITHUB_ENV"
        fi

        # Uses the Python from the reusable workflow's setup-python step,
        # which must be at least 3.11. The venv with tox goes first on PATH,
        # so Maven (see pom.xml) runs this tox.
        python3 -c 'import sys; sys.exit(sys.version_info < (3, 11))' || {
          echo "Python >= 3.11 required, python3 is $(python3 --version)" >&2
          exit 1
        }

        python3 -m venv "$HOME/.pytest-venv"
        "$HOME/.pytest-venv/bin/python" -m pip install pip==26.2.2
        "$HOME/.pytest-venv/bin/python" -m pip install tox==4.65.5

        echo "$HOME/.pytest-venv/bin" >> "$GITHUB_PATH"
        "$HOME/.pytest-venv/bin/tox" -c tests --version

        # Allure 3 turns the pytest results into a single-file HTML report
        # (tests/allurerc.mjs), run from tox's commands_post so failed runs
        # get a report too. Node.js is preinstalled on GitHub-hosted runners.
        npm install --global --prefix "$HOME/.allure" allure@3.20.1

        echo "$HOME/.allure/bin" >> "$GITHUB_PATH"
        "$HOME/.allure/bin/allure" --version

        # Allure trend data (historyPath in tests/allurerc.mjs): continue the
        # newest history.jsonl an earlier run published. With a schedule,
        # use only scheduled runs (event=schedule below).
        base="${{ vars.LOG_BASE_URL }}"
        workflow="${GITHUB_WORKFLOW_REF%@*}"
        workflow="${workflow##*/}"
        logs="${base%/}/logs/gha/${GITHUB_REPOSITORY##*/}/${workflow%.*}"
        api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/workflows"
        # Moves this run's history out of the published tests/history.
        keep_history_unpublished() {
          echo "::warning::$1, so this run's Allure history is not published"
          echo "ALLURE_HISTORY_PATH=./history-unpublished/history.jsonl" \
            >> "$GITHUB_ENV"
        }
        if [ -z "${base}" ]; then
          keep_history_unpublished "No LOG_BASE_URL"
        # Anonymous API call; this works because the repository is public.
        elif ids=$(curl -fsSL "${api}/${workflow}/runs?status=completed&per_page=100" \
            | jq -r '.workflow_runs[].id'); then
          mkdir -p tests/history
          # Earlier runs are searched newest first for a history, ending in:
          #   found   - restored; this run extends it and publishes it
          #   failed  - a history could not be read; nothing is published,
          #             so it is kept for later runs
          #   neither - no history yet; this is a fresh start
          found=""
          failed=""
          for id in ${ids}; do
            code=$(curl -sSL --compressed -o tests/history/history.tmp \
              -w '%{http_code}' "${logs}/${id}/tests/history/history.jsonl" \
              || true)
            if [ "${code}" = 200 ]; then
              # jq parses every line; one it cannot parse would make Allure
              # fail, so a damaged file is skipped like a missing one.
              if jq -e . tests/history/history.tmp > /dev/null; then
                mv tests/history/history.tmp tests/history/history.jsonl
                found="${id}"
                break
              fi
            elif [ "${code}" != 404 ]; then
              # 404 only means that run has no history; anything else means
              # the log server could not be read, so the search stops.
              failed="HTTP ${code} for run ${id}"
              break
            fi
          done
          rm -f tests/history/history.tmp
          if [ -n "${found}" ]; then
            echo "Allure history restored from run ${found}"
          elif [ -n "${failed}" ]; then
            keep_history_unpublished "Could not read earlier Allure history (${failed})"
          else
            echo "No earlier Allure history found, starting afresh"
          fi
        else
          keep_history_unpublished "Could not list earlier runs"
        fi

  # Puts a link to the Allure report of the PyTest integration tests on the
  # run's Summary page: straight to the report on the log server, or to the
  # build-logs artifact when the logs were not published to S3.
  pytest-report:
    needs: pytest
    if: ${{ !cancelled() && needs.pytest.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - name: Link Allure report
        continue-on-error: true
        env:
          LOG_URL: ${{ needs.pytest.outputs.LOG_URL }}
        run: |
          report="${LOG_URL}tests/allure-report/allure-report.html"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          if [ -n "${LOG_URL}" ] && curl -fsSI -o /dev/null "${report}"; then
            line="### [📊 Allure report](${report})"
          elif [ -n "${LOG_URL}" ]; then
            line="### ⚠️ Allure report not found at ${report}"
          else
            # Gzipped under its original name, see ARCHIVE_ARTIFACTS above.
            line="### 📦 Allure report: \`build-logs\` artifact of [this run](${run}#artifacts)."
            line="${line} allure-report.html in it is gzipped despite its name,"
            line="${line} unpack it first: \`zcat allure-report.html > report.html\`"
          fi
          echo "${line}" >> "$GITHUB_STEP_SUMMARY"
